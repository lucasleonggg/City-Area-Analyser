# Runs the full test suite (unit tests, reproducibility checks and a headless
# smoke test of every dashboard page) on every push and pull request, from a
# clean environment built only from the pinned requirements.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt pytest==9.1.1
      - name: Verify input data against the manifest
        run: python pipeline/manifest.py --check --skip-missing
      - name: Run tests
        run: python -m pytest tests/ -v
